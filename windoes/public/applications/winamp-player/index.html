<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Winamp Player Clone</title>
    <link rel="stylesheet" href="skin/skin.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #3a6ea5;
        font-family: 'Arial', sans-serif;
        user-select: none;
        min-height: 100vh;
      }

      /* ===== WINAMP CONTAINER ===== */
      #winamp {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 0;
      }

      /* ===== MAIN WINDOW =====
         Pixel art comes from skin/skin.css, one .wa-<sheet>-<frame> class per
         sprite, built from skin-src/ by scripts/build-winamp-skin.mjs. This
         block only places the sprites, at the reference layout in
         tests/winamp-skin/layout.mjs. app.js swaps the .wa-* classes for
         states (pressed, on/off, levels, glyphs). */
      #main-window {
        position: relative;
        overflow: hidden;
        cursor: default;
      }

      #main-window > *,
      #title-bar > *,
      #time-display > * {
        position: absolute;
        display: block;
      }
      /* A hidden sprite keeps its place, so the layout stays measurable. */
      #main-window [hidden] {
        display: block;
        visibility: hidden;
      }

      #main-window button,
      #main-window input {
        border: 0;
        border-radius: 0;
        padding: 0;
        margin: 0;
        background-color: transparent;
        cursor: pointer;
      }
      #main-window :focus {
        outline: none;
      }
      #main-window :focus-visible {
        outline: 1px dotted #fff;
        outline-offset: -1px;
      }

      /* Visible to screen readers only: the text behind a row of glyph sprites. */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      /* A row of font glyph sprites. */
      .glyphs {
        position: absolute;
        left: 0;
        top: 0;
        display: flex;
      }
      .glyphs > span {
        flex: none;
      }

      #title-bar {
        left: 0;
        top: 0;
      }
      #btn-options {
        left: 6px;
        top: 3px;
      }
      #btn-minimize {
        left: 244px;
        top: 3px;
      }
      #btn-shade {
        left: 254px;
        top: 3px;
      }
      #btn-close {
        left: 264px;
        top: 3px;
      }

      #clutter-bar {
        left: 10px;
        top: 22px;
      }
      #play-indicator {
        left: 26px;
        top: 28px;
      }
      /* Overlaps the play indicator's first column, as in the reference. */
      #work-indicator {
        left: 24px;
        top: 28px;
      }

      #time-display {
        left: 36px;
        top: 26px;
        width: 63px;
        height: 13px;
        cursor: pointer;
      }
      #time-minus {
        left: 3px;
        top: 6px;
      }
      #time-digit-1 {
        left: 12px;
      }
      #time-digit-2 {
        left: 24px;
      }
      #time-digit-3 {
        left: 42px;
      }
      #time-digit-4 {
        left: 54px;
      }

      #visualizer {
        left: 24px;
        top: 43px;
        width: 76px;
        height: 16px;
        image-rendering: pixelated;
        cursor: pointer;
      }

      #scrolling-title {
        left: 111px;
        top: 24px;
        width: 154px;
        height: 6px;
        overflow: hidden;
      }
      #bitrate-val {
        left: 111px;
        top: 43px;
        width: 15px;
        height: 6px;
      }
      #freq-val {
        left: 156px;
        top: 43px;
        width: 10px;
        height: 6px;
      }
      #mono-indicator {
        left: 212px;
        top: 41px;
      }
      #stereo-indicator {
        left: 239px;
        top: 41px;
      }

      /* Native range inputs keep mouse and keyboard behaviour; their own track
         and thumb are transparent. The sprite thumbs beside them follow the
         value (app.js) and let pointer events through. */
      #main-window input[type='range'] {
        -webkit-appearance: none;
        appearance: none;
      }
      #main-window input[type='range']::-webkit-slider-runnable-track {
        height: 100%;
        background: transparent;
        border: 0;
      }
      #main-window input[type='range']::-moz-range-track {
        height: 100%;
        background: transparent;
        border: 0;
      }
      #main-window input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 100%;
        background: transparent;
        border: 0;
      }
      #main-window input[type='range']::-moz-range-thumb {
        width: 14px;
        height: 100%;
        background: transparent;
        border: 0;
      }
      #main-window #seek-bar::-webkit-slider-thumb {
        width: 29px;
      }
      #main-window #seek-bar::-moz-range-thumb {
        width: 29px;
      }
      .thumb {
        pointer-events: none;
      }

      #seek-bar,
      #seek-thumb {
        left: 16px;
        top: 72px;
      }
      #volume-slider,
      #volume-thumb {
        left: 107px;
        top: 57px;
      }
      #balance-slider,
      #balance-thumb {
        left: 177px;
        top: 57px;
      }
      #volume-thumb,
      #balance-thumb {
        margin-top: 1px;
      }

      #btn-eq {
        left: 219px;
        top: 58px;
      }
      #btn-pl {
        left: 242px;
        top: 58px;
      }

      #btn-prev,
      #btn-play,
      #btn-pause,
      #btn-stop,
      #btn-next {
        top: 88px;
      }
      #btn-prev {
        left: 16px;
      }
      #btn-play {
        left: 39px;
      }
      #btn-pause {
        left: 62px;
      }
      #btn-stop {
        left: 85px;
      }
      #btn-next {
        left: 108px;
      }
      #btn-open {
        left: 136px;
        top: 89px;
      }
      #btn-shuffle {
        left: 164px;
        top: 89px;
      }
      /* Covers the shuffle button's last column, as in the reference. */
      #btn-repeat {
        left: 210px;
        top: 89px;
      }
      /* The logo is part of the background art; the button is the hit area. */
      #btn-about {
        left: 253px;
        top: 91px;
        width: 13px;
        height: 15px;
      }

      /* ===== SHARED BY THE EQUALIZER (until its own art lands) ===== */
      .title-bar-line {
        flex: 1;
        height: 7px;
        background: repeating-linear-gradient(
          180deg,
          #8a7a46 0px,
          #8a7a46 1px,
          #1a1408 1px,
          #1a1408 2px,
          transparent 2px,
          transparent 3px
        );
        min-width: 8px;
      }

      /* ===== EQUALIZER WINDOW =====
         Sprites from skin/skin.css (skin-src/eqmain.txt), placed at the
         reference layout in tests/winamp-skin/layout.mjs, as in the main
         window. app.js swaps the .wa-* classes for states and draws the graph
         from the same sheet. */
      #eq-window {
        position: relative;
        overflow: hidden;
        cursor: default;
      }

      #eq-window > *,
      #eq-title-bar > *,
      .eq-band > * {
        position: absolute;
        display: block;
      }

      #eq-window button,
      #eq-window input {
        border: 0;
        border-radius: 0;
        padding: 0;
        margin: 0;
        background-color: transparent;
        cursor: pointer;
      }
      #eq-window :focus {
        outline: none;
      }
      #eq-window :focus-visible {
        outline: 1px dotted #fff;
        outline-offset: -1px;
      }

      #eq-title-bar {
        left: 0;
        top: 0;
      }
      #eq-btn-shade {
        left: 254px;
        top: 3px;
      }
      #eq-btn-close {
        left: 264px;
        top: 3px;
      }
      #eq-on-btn {
        left: 14px;
        top: 18px;
      }
      #eq-auto-btn {
        left: 40px;
        top: 18px;
      }
      #eq-presets-btn {
        left: 217px;
        top: 18px;
      }
      #eq-graph {
        left: 86px;
        top: 17px;
        width: 113px;
        height: 19px;
        image-rendering: pixelated;
      }

      /* Sliders: vertical native range inputs (keyboard and pointer), their own
         track and thumb transparent; the level frame is the input's background
         and the sprite thumb beside it follows the value (app.js). */
      #eq-preamp-slider {
        left: 21px;
        top: 38px;
      }
      #eq-bands {
        left: 78px;
        top: 38px;
        width: 176px;
        height: 63px;
      }
      .eq-band {
        position: absolute;
        top: 0;
        width: 14px;
        height: 63px;
      }
      .eq-band > input {
        left: 0;
        top: 0;
      }
      #eq-window input[type='range'] {
        -webkit-appearance: none;
        appearance: none;
        writing-mode: vertical-lr;
        direction: rtl;
      }
      #eq-window input[type='range']::-webkit-slider-runnable-track {
        width: 100%;
        height: 100%;
        background: transparent;
        border: 0;
      }
      #eq-window input[type='range']::-moz-range-track {
        width: 100%;
        height: 100%;
        background: transparent;
        border: 0;
      }
      #eq-window input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 11px;
        background: transparent;
        border: 0;
      }
      #eq-window input[type='range']::-moz-range-thumb {
        width: 14px;
        height: 11px;
        background: transparent;
        border: 0;
      }
      /* The 11 px thumb sits one pixel in from the 14 px slider's left edge. */
      #eq-preamp-thumb {
        left: 22px;
      }
      .eq-band > .thumb {
        left: 1px;
      }

      /* ===== PLAYLIST WINDOW =====
         Sprites from skin/skin.css (sheet pledit), placed at the reference
         layout in tests/winamp-skin/layout.mjs, as for the main window.
         Tiles repeat as one element per tile, placed inline in the markup;
         a tile cut short shows its left part. */
      #playlist-window {
        position: relative;
        width: 275px;
        height: 116px;
        overflow: hidden;
        cursor: default;
      }

      #playlist-window > *,
      #playlist-title > * {
        position: absolute;
        display: block;
      }

      #playlist-window button {
        border: 0;
        border-radius: 0;
        padding: 0;
        margin: 0;
        background-color: transparent;
        cursor: pointer;
      }
      #playlist-window :focus {
        outline: none;
      }
      #playlist-window :focus-visible {
        outline: 1px dotted #fff;
        outline-offset: -1px;
      }

      #playlist-title {
        left: 0;
        top: 0;
        width: 275px;
        height: 20px;
      }
      #playlist-title .pl-tile-12 {
        width: 12px;
      }
      #playlist-title .pl-tile-13 {
        width: 13px;
      }
      #pl-btn-shade,
      #pl-btn-close {
        top: 3px;
        width: 9px;
        height: 9px;
      }
      #pl-btn-shade {
        left: 254px;
      }
      #pl-btn-close {
        left: 264px;
      }

      /* Rows: 13 px pitch, glyphs of the playlist font (an alpha mask filled
         with the row colour). The native scroll bar is hidden; the sprite
         handle in the right tile follows the scroll position. */
      #playlist-tracks {
        left: 12px;
        top: 20px;
        width: 243px;
        height: 58px;
        overflow-x: hidden;
        overflow-y: auto;
        scrollbar-width: none;
        background: #000;
      }
      #playlist-tracks::-webkit-scrollbar {
        display: none;
      }

      .track-item {
        display: flex;
        height: 13px;
        padding: 2px 2px 0 2px;
        gap: 4px;
        color: #00ff00;
      }
      .track-item.current {
        color: #ffffff;
      }
      .track-item.selected {
        background: #0000c6;
      }
      .track-name,
      .track-duration {
        display: flex;
        height: 9px;
      }
      .track-name {
        flex: 1;
        overflow: hidden;
      }
      .track-name > span,
      .track-duration > span {
        flex: none;
      }

      #playlist-scroll-handle {
        left: 260px;
        top: 20px;
        cursor: pointer;
      }

      #pl-add-btn,
      #pl-rem-btn,
      #pl-sel-btn,
      #pl-misc-btn,
      #pl-listopts-btn {
        top: 86px;
        width: 22px;
        height: 18px;
      }
      #pl-add-btn {
        left: 14px;
      }
      #pl-rem-btn {
        left: 43px;
      }
      #pl-sel-btn {
        left: 72px;
      }
      #pl-misc-btn {
        left: 101px;
      }
      #pl-listopts-btn {
        left: 229px;
      }

      /* Running time (selected / total) and the playing track's time, in
         the 5x6 font; as wide as the longest text each shows. */
      #playlist-running-time,
      #playlist-mini-time {
        height: 6px;
      }
      #playlist-running-time {
        left: 132px;
        top: 88px;
        width: 55px;
      }
      #playlist-mini-time {
        left: 191px;
        top: 101px;
        width: 30px;
      }

      /* Mini transport: hit areas over the icons in the bottom-right art. */
      #playlist-window .pl-mini {
        top: 100px;
        width: 10px;
        height: 10px;
      }
      #pl-mini-prev {
        left: 128px;
      }
      #pl-mini-play {
        left: 138px;
      }
      #pl-mini-pause {
        left: 148px;
      }
      #pl-mini-stop {
        left: 158px;
      }
      #pl-mini-next {
        left: 168px;
      }
      #pl-mini-open {
        left: 178px;
      }

      /* File input hidden */
      #file-input {
        display: none;
      }

      /* ===== ABOUT OVERLAY ===== */
      .about-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        z-index: 100;
        justify-content: center;
        align-items: center;
      }

      .about-overlay.visible {
        display: flex;
      }

      .about-window {
        background: #c0c0c0;
        border: 2px outset #dfdfdf;
        width: 300px;
        box-shadow: 3px 3px 0 #000;
      }

      .about-titlebar {
        background: linear-gradient(90deg, #000080, #1084d0);
        padding: 2px 4px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .about-titlebar span {
        color: #fff;
        font-size: 11px;
        font-weight: bold;
        font-family: 'Tahoma', sans-serif;
      }

      .about-close {
        width: 16px;
        height: 14px;
        background: #c0c0c0;
        border: 2px outset #dfdfdf;
        font-size: 10px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-family: 'Tahoma', sans-serif;
      }

      .about-close:active {
        border-style: inset;
      }

      .about-body {
        padding: 16px;
        text-align: center;
        font-family: 'Tahoma', 'MS Sans Serif', sans-serif;
        font-size: 11px;
      }

      .about-body h3 {
        font-size: 14px;
        margin-bottom: 8px;
        color: #000;
      }

      .about-body p {
        color: #333;
        margin: 4px 0;
      }

      .about-ok {
        margin-top: 12px;
        padding: 2px 20px;
        font-size: 11px;
        font-family: 'Tahoma', sans-serif;
        background: #c0c0c0;
        border: 2px outset #dfdfdf;
        cursor: pointer;
      }

      .about-ok:active {
        border-style: inset;
      }
    </style>
  </head>
  <body>
    <!-- About dialog -->
    <div class="about-overlay" id="about-overlay">
      <div class="about-window">
        <div class="about-titlebar">
          <span>About Winamp</span>
          <div class="about-close" onclick="closeAbout()">×</div>
        </div>
        <div class="about-body">
          <h3>Winamp Clone v1.0</h3>
          <p>A nostalgic recreation of the classic</p>
          <p>Winamp media player.</p>
          <p style="margin-top: 8px; color: #888; font-size: 9px">
            Built with HTML, CSS & JavaScript
          </p>
          <p style="color: #888; font-size: 9px">Audio API: Web Audio + HTML5 Audio</p>
          <button class="about-ok" onclick="closeAbout()">OK</button>
        </div>
      </div>
    </div>

    <div id="winamp">
      <!-- Main Player Window: sprites from skin/skin.css, placed at the reference layout. -->
      <div class="wa-main-background" id="main-window">
        <div class="wa-titlebar-active" id="title-bar">
          <button
            type="button"
            class="wa-titlebar-options"
            id="btn-options"
            data-sprite="titlebar-options"
            title="Options"
          ></button>
          <button
            type="button"
            class="wa-titlebar-minimize"
            id="btn-minimize"
            data-sprite="titlebar-minimize"
            title="Minimize"
          ></button>
          <button
            type="button"
            class="wa-titlebar-shade"
            id="btn-shade"
            data-sprite="titlebar-shade"
            title="Window shade"
          ></button>
          <button
            type="button"
            class="wa-titlebar-close"
            id="btn-close"
            data-sprite="titlebar-close"
            title="Close"
          ></button>
        </div>

        <div class="wa-titlebar-clutter" id="clutter-bar"></div>
        <div class="wa-playpaus-stop" id="play-indicator"></div>
        <div class="wa-playpaus-work-off" id="work-indicator"></div>
        <div id="time-display" role="timer" title="Elapsed / remaining time">
          <span class="sr-only" id="time-text">00:00</span>
          <span class="wa-main-time-minus" id="time-minus" hidden></span>
          <span class="wa-font-digits-48" id="time-digit-1"></span>
          <span class="wa-font-digits-48" id="time-digit-2"></span>
          <span class="wa-font-digits-48" id="time-digit-3"></span>
          <span class="wa-font-digits-48" id="time-digit-4"></span>
        </div>
        <canvas id="visualizer" width="76" height="16" title="Visualizer"></canvas>
        <div id="scrolling-title"></div>
        <div id="bitrate-val" title="kbps"></div>
        <div id="freq-val" title="kHz"></div>
        <div class="wa-monoster-mono-off" id="mono-indicator"></div>
        <div class="wa-monoster-stereo-off" id="stereo-indicator"></div>

        <input
          type="range"
          class="wa-posbar-background"
          id="seek-bar"
          min="0"
          max="100"
          value="0"
          title="Seek"
        />
        <div class="thumb wa-posbar-thumb" id="seek-thumb" data-sprite="posbar-thumb"></div>
        <input
          type="range"
          class="wa-volume-level-20"
          id="volume-slider"
          min="0"
          max="100"
          value="75"
          title="Volume"
        />
        <div class="thumb wa-volume-thumb" id="volume-thumb" data-sprite="volume-thumb"></div>
        <input
          type="range"
          class="wa-balance-level-0"
          id="balance-slider"
          min="-100"
          max="100"
          value="0"
          title="Balance"
        />
        <div class="thumb wa-balance-thumb" id="balance-thumb" data-sprite="balance-thumb"></div>

        <button
          type="button"
          class="active wa-shufrep-eq-on"
          id="btn-eq"
          data-toggle="shufrep-eq"
          title="Equalizer"
        ></button>
        <button
          type="button"
          class="active wa-shufrep-pl-on"
          id="btn-pl"
          data-toggle="shufrep-pl"
          title="Playlist"
        ></button>

        <button
          type="button"
          class="wa-cbuttons-previous"
          id="btn-prev"
          data-sprite="cbuttons-previous"
          title="Previous"
        ></button>
        <button
          type="button"
          class="wa-cbuttons-play"
          id="btn-play"
          data-sprite="cbuttons-play"
          title="Play"
        ></button>
        <button
          type="button"
          class="wa-cbuttons-pause"
          id="btn-pause"
          data-sprite="cbuttons-pause"
          title="Pause"
        ></button>
        <button
          type="button"
          class="wa-cbuttons-stop"
          id="btn-stop"
          data-sprite="cbuttons-stop"
          title="Stop"
        ></button>
        <button
          type="button"
          class="wa-cbuttons-next"
          id="btn-next"
          data-sprite="cbuttons-next"
          title="Next"
        ></button>
        <button
          type="button"
          class="wa-cbuttons-eject"
          id="btn-open"
          data-sprite="cbuttons-eject"
          title="Open file"
        ></button>
        <button
          type="button"
          class="wa-shufrep-shuffle-off"
          id="btn-shuffle"
          data-toggle="shufrep-shuffle"
          title="Shuffle"
        ></button>
        <button
          type="button"
          class="wa-shufrep-repeat-off"
          id="btn-repeat"
          data-toggle="shufrep-repeat"
          title="Repeat"
        ></button>
        <button type="button" id="btn-about" title="About Winamp"></button>
      </div>

      <!-- Equalizer Window: sprites from skin/skin.css, placed at the reference layout. -->
      <div class="wa-eqmain-background" id="eq-window">
        <div class="wa-eqmain-title-active" id="eq-title-bar">
          <button
            type="button"
            class="wa-eqmain-shade"
            id="eq-btn-shade"
            data-sprite="eqmain-shade"
            title="Window shade"
          ></button>
          <button
            type="button"
            class="wa-eqmain-close"
            id="eq-btn-close"
            data-sprite="eqmain-close"
            title="Close equalizer"
          ></button>
        </div>
        <button
          type="button"
          class="active wa-eqmain-on-on"
          id="eq-on-btn"
          data-toggle="eqmain-on"
          title="Equalizer on"
        ></button>
        <button
          type="button"
          class="wa-eqmain-auto-off"
          id="eq-auto-btn"
          data-sprite="eqmain-auto-off"
          title="Reset equalizer"
        ></button>
        <button
          type="button"
          class="wa-eqmain-presets"
          id="eq-presets-btn"
          data-sprite="eqmain-presets"
          title="Presets"
        ></button>
        <canvas id="eq-graph" width="113" height="19" title="Equalizer curve"></canvas>
        <input
          type="range"
          class="wa-eqmain-slider-level-14"
          id="eq-preamp-slider"
          min="-12"
          max="12"
          value="0"
          title="Preamp"
        />
        <div class="thumb wa-eqmain-thumb" id="eq-preamp-thumb" data-sprite="eqmain-thumb"></div>
        <!-- Ten bands, built by app.js: .eq-band > input + .thumb -->
        <div id="eq-bands"></div>
      </div>

      <!-- Playlist Window: sprites from skin/skin.css (sheet pledit), placed at the reference layout. -->
      <div id="playlist-window">
        <div id="playlist-title" title="Winamp Playlist">
          <span class="wa-pledit-top-left-active" data-frame="pledit-top-left"></span>
          <span
            class="wa-pledit-top-tile-active"
            data-frame="pledit-top-tile"
            style="left: 25px"
          ></span>
          <span
            class="wa-pledit-top-tile-active"
            data-frame="pledit-top-tile"
            style="left: 50px"
          ></span>
          <span
            class="wa-pledit-top-tile-active pl-tile-12"
            data-frame="pledit-top-tile"
            style="left: 75px"
          ></span>
          <span class="wa-pledit-title-active" data-frame="pledit-title" style="left: 87px"></span>
          <span
            class="wa-pledit-top-tile-active"
            data-frame="pledit-top-tile"
            style="left: 187px"
          ></span>
          <span
            class="wa-pledit-top-tile-active"
            data-frame="pledit-top-tile"
            style="left: 212px"
          ></span>
          <span
            class="wa-pledit-top-tile-active pl-tile-13"
            data-frame="pledit-top-tile"
            style="left: 237px"
          ></span>
          <span
            class="wa-pledit-top-right-active"
            data-frame="pledit-top-right"
            style="left: 250px"
          ></span>
        </div>
        <button
          type="button"
          id="pl-btn-shade"
          data-pressed="pledit-shade-pressed"
          title="Window shade"
        ></button>
        <button
          type="button"
          id="pl-btn-close"
          data-pressed="pledit-close-pressed"
          title="Close playlist"
        ></button>

        <span class="wa-pledit-left-tile" style="left: 0; top: 20px"></span>
        <span class="wa-pledit-left-tile" style="left: 0; top: 49px"></span>
        <span class="wa-pledit-right-tile" style="left: 255px; top: 20px"></span>
        <span class="wa-pledit-right-tile" style="left: 255px; top: 49px"></span>
        <div
          id="playlist-tracks"
          role="listbox"
          tabindex="0"
          aria-label="Playlist"
          title="Double-click a track to play it"
        ></div>
        <div
          class="wa-pledit-scroll-handle"
          id="playlist-scroll-handle"
          data-sprite="pledit-scroll-handle"
          aria-hidden="true"
        ></div>

        <span class="wa-pledit-bottom-left" style="left: 0; top: 78px"></span>
        <span class="wa-pledit-bottom-right" style="left: 125px; top: 78px"></span>
        <button
          type="button"
          id="pl-add-btn"
          data-pressed="pledit-add-pressed"
          title="Add files"
        ></button>
        <button
          type="button"
          id="pl-rem-btn"
          data-pressed="pledit-rem-pressed"
          title="Remove selected"
        ></button>
        <button
          type="button"
          id="pl-sel-btn"
          data-pressed="pledit-sel-pressed"
          title="Select"
        ></button>
        <button
          type="button"
          id="pl-misc-btn"
          data-pressed="pledit-misc-pressed"
          title="Misc"
        ></button>
        <div id="playlist-running-time" title="Selected / total length"></div>
        <button type="button" class="pl-mini" id="pl-mini-prev" title="Previous"></button>
        <button type="button" class="pl-mini" id="pl-mini-play" title="Play"></button>
        <button type="button" class="pl-mini" id="pl-mini-pause" title="Pause"></button>
        <button type="button" class="pl-mini" id="pl-mini-stop" title="Stop"></button>
        <button type="button" class="pl-mini" id="pl-mini-next" title="Next"></button>
        <button type="button" class="pl-mini" id="pl-mini-open" title="Open file"></button>
        <div id="playlist-mini-time" role="timer" title="Elapsed time"></div>
        <button
          type="button"
          id="pl-listopts-btn"
          data-pressed="pledit-list-opts-pressed"
          title="List options"
        ></button>
      </div>
    </div>

    <input type="file" id="file-input" accept="audio/*" multiple />

    <script src="app.js"></script>
  </body>
</html>
