<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- monitor shell -->
  <rect x="2" y="4" width="28" height="21" fill="#c3c3c3" stroke="#000" stroke-width="1"/>
  <rect x="3" y="5" width="26" height="19" fill="#dfdfdf"/>
  <rect x="3" y="5" width="25" height="18" fill="#c3c3c3"/>
  <!-- screen bezel + screen -->
  <rect x="5" y="7" width="22" height="14" fill="#808080"/>
  <rect x="6" y="8" width="20" height="12" fill="#000080"/>
  <!-- guest "boot log" -->
  <rect x="8" y="10" width="9" height="1" fill="#c0c0c0"/>
  <rect x="8" y="12" width="13" height="1" fill="#c0c0c0"/>
  <rect x="8" y="14" width="6" height="1" fill="#c0c0c0"/>
  <rect x="8" y="17" width="2" height="1" fill="#00ff00"/>
  <rect x="11" y="16" width="1" height="2" fill="#00ff00"/>
  <!-- power light -->
  <rect x="26" y="22" width="2" height="1" fill="#00c000"/>
  <!-- stand -->
  <rect x="13" y="25" width="6" height="3" fill="#a0a0a0" stroke="#000" stroke-width="1"/>
  <rect x="8" y="28" width="16" height="3" fill="#c3c3c3" stroke="#000" stroke-width="1"/>
  <!-- "virtual" badge: a wireframe box floating over the corner -->
  <path d="M18.5 21.5 L24.5 21.5 L27.5 19.5 L21.5 19.5 Z" fill="#1084d0" stroke="#003f6b" stroke-width="1"/>
  <path d="M18.5 21.5 L18.5 27.5 L24.5 27.5 L24.5 21.5 Z" fill="#3aa0e8" stroke="#003f6b" stroke-width="1"/>
  <path d="M24.5 21.5 L27.5 19.5 L27.5 25.5 L24.5 27.5 Z" fill="#0a6cae" stroke="#003f6b" stroke-width="1"/>
</svg>
