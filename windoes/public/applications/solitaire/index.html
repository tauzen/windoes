<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Solitaire</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: #c0c0c0;
        font-family: 'MS Sans Serif', 'Tahoma', 'Arial', sans-serif;
        font-size: 11px;
        overflow: hidden;
        user-select: none;
      }

      .window {
        background: #c0c0c0;
        display: flex;
        flex-direction: column;
        width: 680px;
      }

      /* ===== MENU BAR ===== */
      .menu-bar {
        background: #c0c0c0;
        border-bottom: 1px solid #808080;
        padding: 1px 0;
        display: flex;
        align-items: center;
        height: 20px;
        position: relative;
      }

      .menu-item {
        padding: 2px 8px;
        cursor: pointer;
        position: relative;
        color: #000000;
      }

      .menu-item:hover {
        background: #000080;
        color: white;
      }

      .menu-dropdown {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        background: #c0c0c0;
        border: 2px solid;
        border-color: #dfdfdf #404040 #404040 #dfdfdf;
        box-shadow: 2px 2px 0 #000;
        z-index: 1000;
        min-width: 160px;
      }

      .menu-dropdown.open {
        display: block;
      }

      .menu-dropdown-item {
        padding: 4px 20px;
        cursor: pointer;
        white-space: nowrap;
        color: #000000;
      }

      .menu-dropdown-item:hover {
        background: #000080;
        color: white;
      }

      .menu-separator {
        height: 1px;
        background: #808080;
        margin: 2px 4px;
        border-bottom: 1px solid #dfdfdf;
      }

      /* ===== STATUS BAR ===== */
      .status-bar {
        background: #c0c0c0;
        border-top: 1px solid #808080;
        padding: 2px 4px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 22px;
        font-size: 11px;
      }

      .status-section {
        border: 1px solid;
        border-color: #808080 #dfdfdf #dfdfdf #808080;
        padding: 1px 6px;
        min-width: 80px;
        text-align: center;
      }

      /* ===== GAME AREA ===== */
      .game-area {
        background: #008000;
        width: 680px;
        height: 460px;
        position: relative;
        overflow: hidden;
      }

      /* ===== CARD STYLES ===== */
      .card {
        width: 65px;
        height: 90px;
        border-radius: 4px;
        position: absolute;
        cursor: pointer;
        font-family: 'Georgia', 'Times New Roman', serif;
        touch-action: none;
      }

      .card-face {
        background: white;
        border: 1px solid #333;
        border-radius: 4px;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 3px;
        box-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
      }

      .card-face.red {
        color: #cc0000;
      }

      .card-face.black {
        color: #000;
      }

      .card-top {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        line-height: 1;
      }

      .card-bottom {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        line-height: 1;
        transform: rotate(180deg);
      }

      .card-rank {
        font-size: 13px;
        font-weight: bold;
      }

      .card-suit-small {
        font-size: 11px;
      }

      .card-center {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 24px;
      }

      .card-pips {
        position: absolute;
        top: 16px;
        bottom: 16px;
        left: 4px;
        right: 4px;
      }

      .pip {
        position: absolute;
        font-size: 12px;
        line-height: 1;
        transform: translate(-50%, -50%);
      }

      .pip-flip {
        transform: translate(-50%, -50%) rotate(180deg);
      }

      .card-back {
        background: #1a1a8a;
        border: 1px solid #333;
        border-radius: 4px;
        width: 100%;
        height: 100%;
        box-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        overflow: hidden;
        position: relative;
      }

      .card-back-pattern {
        width: 100%;
        height: 100%;
        background:
          repeating-linear-gradient(
            45deg,
            transparent,
            transparent 3px,
            rgba(200, 50, 50, 0.4) 3px,
            rgba(200, 50, 50, 0.4) 4px
          ),
          repeating-linear-gradient(
            -45deg,
            transparent,
            transparent 3px,
            rgba(200, 50, 50, 0.4) 3px,
            rgba(200, 50, 50, 0.4) 4px
          );
        border: 3px solid #2a2ab0;
        border-radius: 3px;
      }

      .card-back-inner {
        position: absolute;
        top: 8px;
        left: 8px;
        right: 8px;
        bottom: 8px;
        border: 1px solid #4444cc;
        border-radius: 2px;
      }

      /* Placeholder for empty piles */
      .pile-placeholder {
        width: 65px;
        height: 90px;
        border-radius: 4px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        position: absolute;
      }

      .foundation-placeholder::after {
        content: attr(data-suit);
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 28px;
        color: rgba(255, 255, 255, 0.2);
      }

      .stock-placeholder {
        cursor: pointer;
      }

      .stock-placeholder::after {
        content: '\21BB';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 28px;
        color: rgba(255, 255, 255, 0.3);
      }

      /* Drag ghost */
      .card.dragging {
        z-index: 9999 !important;
        box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.4);
        opacity: 0.9;
        pointer-events: none;
      }

      .card.selected {
        outline: 3px solid #ffff00;
        outline-offset: -1px;
      }

      /* About dialog */
      .about-overlay {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10001;
        justify-content: center;
        align-items: center;
      }

      .about-overlay.show {
        display: flex;
      }

      .about-window {
        background: #c0c0c0;
        border: 2px solid;
        border-color: #dfdfdf #404040 #404040 #dfdfdf;
        box-shadow: 2px 2px 0 #000;
        min-width: 260px;
      }

      .about-titlebar {
        background: linear-gradient(to right, #000080, #1084d0);
        color: white;
        padding: 3px 4px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        font-weight: bold;
      }

      .about-close-btn {
        background: #c0c0c0;
        border: 2px solid;
        border-color: #dfdfdf #404040 #404040 #dfdfdf;
        width: 16px;
        height: 14px;
        font-size: 9px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        padding: 0;
        font-family: 'MS Sans Serif', 'Tahoma', 'Arial', sans-serif;
      }

      .about-close-btn:active {
        border-color: #404040 #dfdfdf #dfdfdf #404040;
      }

      .about-body {
        padding: 16px 20px 12px;
        text-align: center;
      }

      .about-body h2 {
        font-size: 13px;
        margin-bottom: 6px;
      }

      .about-body p {
        font-size: 11px;
        margin-bottom: 4px;
        color: #000;
      }

      .about-separator {
        border: none;
        border-top: 1px solid #808080;
        border-bottom: 1px solid #dfdfdf;
        margin: 10px 0;
      }

      .about-footer {
        padding: 0 20px 12px;
        text-align: center;
      }

      /* Win overlay */
      .win-overlay {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.6);
        z-index: 10000;
        justify-content: center;
        align-items: center;
        flex-direction: column;
      }

      .win-overlay.show {
        display: flex;
      }

      .win-message {
        background: #c0c0c0;
        border: 2px solid;
        border-color: #dfdfdf #404040 #404040 #dfdfdf;
        padding: 20px 30px;
        text-align: center;
        box-shadow: 2px 2px 0 #000;
      }

      .win-message h2 {
        font-size: 16px;
        margin-bottom: 10px;
      }

      .win-message p {
        margin-bottom: 12px;
        font-size: 12px;
      }

      .win-btn {
        background: #c0c0c0;
        border: 2px solid;
        border-color: #dfdfdf #404040 #404040 #dfdfdf;
        padding: 4px 20px;
        font-family: 'MS Sans Serif', 'Tahoma', 'Arial', sans-serif;
        font-size: 11px;
        cursor: pointer;
      }

      .win-btn:active {
        border-color: #404040 #dfdfdf #dfdfdf #404040;
      }
    </style>
  </head>
  <body>
    <div class="window" id="window">
      <div class="menu-bar">
        <div class="menu-item" id="menu-game">
          <span>Game</span>
          <div class="menu-dropdown" id="dropdown-game">
            <div class="menu-dropdown-item" id="menu-new-game">New Game &nbsp;&nbsp; F2</div>
            <div class="menu-separator"></div>
            <div class="menu-dropdown-item" id="menu-undo">Undo &nbsp;&nbsp; Ctrl+Z</div>
          </div>
        </div>
        <div class="menu-item" id="menu-help-item">
          <span>Help</span>
          <div class="menu-dropdown" id="dropdown-help">
            <div class="menu-dropdown-item" id="menu-about">About Solitaire</div>
          </div>
        </div>
      </div>

      <div class="about-overlay" id="aboutOverlay">
        <div class="about-window">
          <div class="about-titlebar">
            <span>About Solitaire</span>
            <button class="about-close-btn" id="aboutCloseBtn">x</button>
          </div>
          <div class="about-body">
            <h2>Solitaire</h2>
            <p>Windoes XD Edition</p>
            <hr class="about-separator" />
            <p>Classic Klondike Solitaire</p>
          </div>
          <div class="about-footer">
            <button class="win-btn" id="aboutOkBtn">OK</button>
          </div>
        </div>
      </div>

      <div class="game-area" id="gameArea">
        <div class="win-overlay" id="winOverlay">
          <div class="win-message">
            <h2>Congratulations!</h2>
            <p>You won the game!</p>
            <p id="winStats"></p>
            <button class="win-btn" id="winNewGame">New Game</button>
          </div>
        </div>
      </div>

      <div class="status-bar">
        <div class="status-section" id="statusScore">Score: 0</div>
        <div class="status-section" id="statusMoves">Moves: 0</div>
        <div class="status-section" id="statusTime">Time: 0:00</div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
