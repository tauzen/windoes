name: Run Tests

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  # deploy.yml calls this workflow so a deploy runs only after the same checks pass.
  workflow_call:

jobs:
  test:
    # Playwright 1.59 has no Chromium build for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prettier --check .
      # `npm ci` stages these from postinstall and only warns on failure; the
      # VirtualBoks suite boots a guest, so here they have to be present.
      - run: npm run assets:vm
      - run: npx playwright install --with-deps chromium
      - run: npm run test:all
