<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Winamp Player Clone</title>
    <link rel="stylesheet" href="skin/skin.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #3a6ea5;
        font-family: 'Arial', sans-serif;
        user-select: none;
        min-height: 100vh;
      }

      /* ===== WINAMP CONTAINER ===== */
      #winamp {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 0;
      }

      /* ===== MAIN WINDOW =====
         Pixel art comes from skin/skin.css, one .wa-<sheet>-<frame> class per
         sprite, built from skin-src/ by scripts/build-winamp-skin.mjs. This
         block only places the sprites, at the reference layout in
         tests/winamp-skin/layout.mjs. app.js swaps the .wa-* classes for
         states (pressed, on/off, levels, glyphs). */
      #main-window {
        position: relative;
        overflow: hidden;
        cursor: default;
      }

      #main-window > *,
      #title-bar > *,
      #time-display > * {
        position: absolute;
        display: block;
      }
      /* A hidden sprite keeps its place, so the layout stays measurable. */
      #main-window [hidden] {
        display: block;
        visibility: hidden;
      }

      #main-window button,
      #main-window input {
        border: 0;
        border-radius: 0;
        padding: 0;
        margin: 0;
        background-color: transparent;
        cursor: pointer;
      }
      #main-window :focus {
        outline: none;
      }
      #main-window :focus-visible {
        outline: 1px dotted #fff;
        outline-offset: -1px;
      }

      /* Visible to screen readers only: the text behind a row of glyph sprites. */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      /* A row of font glyph sprites. */
      .glyphs {
        position: absolute;
        left: 0;
        top: 0;
        display: flex;
      }
      .glyphs > span {
        flex: none;
      }

      #title-bar {
        left: 0;
        top: 0;
      }
      #btn-options {
        left: 6px;
        top: 3px;
      }
      #btn-minimize {
        left: 244px;
        top: 3px;
      }
      #btn-shade {
        left: 254px;
        top: 3px;
      }
      #btn-close {
        left: 264px;
        top: 3px;
      }

      #clutter-bar {
        left: 10px;
        top: 22px;
      }
      #play-indicator {
        left: 26px;
        top: 28px;
      }
      /* Overlaps the play indicator's first column, as in the reference. */
      #work-indicator {
        left: 24px;
        top: 28px;
      }

      #time-display {
        left: 36px;
        top: 26px;
        width: 63px;
        height: 13px;
        cursor: pointer;
      }
      #time-minus {
        left: 3px;
        top: 6px;
      }
      #time-digit-1 {
        left: 12px;
      }
      #time-digit-2 {
        left: 24px;
      }
      #time-digit-3 {
        left: 42px;
      }
      #time-digit-4 {
        left: 54px;
      }

      #visualizer {
        left: 24px;
        top: 43px;
        width: 76px;
        height: 16px;
        image-rendering: pixelated;
        cursor: pointer;
      }

      #scrolling-title {
        left: 111px;
        top: 24px;
        width: 154px;
        height: 6px;
        overflow: hidden;
      }
      #bitrate-val {
        left: 111px;
        top: 43px;
        width: 15px;
        height: 6px;
      }
      #freq-val {
        left: 156px;
        top: 43px;
        width: 10px;
        height: 6px;
      }
      #mono-indicator {
        left: 212px;
        top: 41px;
      }
      #stereo-indicator {
        left: 239px;
        top: 41px;
      }

      /* Native range inputs keep mouse and keyboard behaviour; their own track
         and thumb are transparent. The sprite thumbs beside them follow the
         value (app.js) and let pointer events through. */
      #main-window input[type='range'] {
        -webkit-appearance: none;
        appearance: none;
      }
      #main-window input[type='range']::-webkit-slider-runnable-track {
        height: 100%;
        background: transparent;
        border: 0;
      }
      #main-window input[type='range']::-moz-range-track {
        height: 100%;
        background: transparent;
        border: 0;
      }
      #main-window input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 100%;
        background: transparent;
        border: 0;
      }
      #main-window input[type='range']::-moz-range-thumb {
        width: 14px;
        height: 100%;
        background: transparent;
        border: 0;
      }
      #main-window #seek-bar::-webkit-slider-thumb {
        width: 29px;
      }
      #main-window #seek-bar::-moz-range-thumb {
        width: 29px;
      }
      .thumb {
        pointer-events: none;
      }

      #seek-bar,
      #seek-thumb {
        left: 16px;
        top: 72px;
      }
      #volume-slider,
      #volume-thumb {
        left: 107px;
        top: 57px;
      }
      #balance-slider,
      #balance-thumb {
        left: 177px;
        top: 57px;
      }
      #volume-thumb,
      #balance-thumb {
        margin-top: 1px;
      }

      #btn-eq {
        left: 219px;
        top: 58px;
      }
      #btn-pl {
        left: 242px;
        top: 58px;
      }

      #btn-prev,
      #btn-play,
      #btn-pause,
      #btn-stop,
      #btn-next {
        top: 88px;
      }
      #btn-prev {
        left: 16px;
      }
      #btn-play {
        left: 39px;
      }
      #btn-pause {
        left: 62px;
      }
      #btn-stop {
        left: 85px;
      }
      #btn-next {
        left: 108px;
      }
      #btn-open {
        left: 136px;
        top: 89px;
      }
      #btn-shuffle {
        left: 164px;
        top: 89px;
      }
      /* Covers the shuffle button's last column, as in the reference. */
      #btn-repeat {
        left: 210px;
        top: 89px;
      }
      /* The logo is part of the background art; the button is the hit area. */
      #btn-about {
        left: 253px;
        top: 91px;
        width: 13px;
        height: 15px;
      }

      /* ===== SHARED BY THE EQUALIZER (until its own art lands) ===== */
      .title-bar-line {
        flex: 1;
        height: 7px;
        background: repeating-linear-gradient(
          180deg,
          #8a7a46 0px,
          #8a7a46 1px,
          #1a1408 1px,
          #1a1408 2px,
          transparent 2px,
          transparent 3px
        );
        min-width: 8px;
      }

      .winamp-eq input[type='range'] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 10px;
        background: transparent;
        cursor: pointer;
        outline: none;
      }

      .winamp-eq input[type='range']::-webkit-slider-runnable-track {
        height: 3px;
        background: linear-gradient(180deg, #0e0e12, #1a1a22, #0e0e12);
        border-top: 1px solid #060608;
        border-bottom: 1px solid #2a2a32;
        border-radius: 0;
      }

      .winamp-eq input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 10px;
        background: linear-gradient(180deg, #7a7a84 0%, #5a5a64 30%, #3e3e46 70%, #2a2a32 100%);
        border-top: 1px solid #8a8a94;
        border-left: 1px solid #8a8a94;
        border-right: 1px solid #16161c;
        border-bottom: 1px solid #16161c;
        margin-top: -4px;
        cursor: pointer;
      }

      .winamp-eq input[type='range']::-moz-range-track {
        height: 3px;
        background: linear-gradient(180deg, #0e0e12, #1a1a22, #0e0e12);
        border-top: 1px solid #060608;
        border-bottom: 1px solid #2a2a32;
      }

      .winamp-eq input[type='range']::-moz-range-thumb {
        width: 14px;
        height: 10px;
        background: linear-gradient(180deg, #7a7a84 0%, #5a5a64 30%, #3e3e46 70%, #2a2a32 100%);
        border-top: 1px solid #8a8a94;
        border-left: 1px solid #8a8a94;
        border-right: 1px solid #16161c;
        border-bottom: 1px solid #16161c;
        cursor: pointer;
      }

      .toggle-btn {
        height: 15px;
        font-size: 7px;
        color: #5a5a64;
        background: linear-gradient(180deg, #52525a 0%, #3a3a42 50%, #2a2a32 100%);
        border-top: 1px solid #6a6a72;
        border-left: 1px solid #6a6a72;
        border-right: 1px solid #16161c;
        border-bottom: 1px solid #16161c;
        padding: 0 4px;
        cursor: pointer;
        font-family: 'Arial', sans-serif;
        font-weight: bold;
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
        gap: 2px;
      }

      .toggle-btn.active {
        color: #00cc00;
        text-shadow: 0 0 4px rgba(0, 200, 0, 0.4);
      }

      .toggle-btn:hover {
        color: #8a8a94;
      }
      .toggle-btn.active:hover {
        color: #00cc00;
      }

      /* ===== EQUALIZER WINDOW ===== */
      .winamp-eq {
        width: 275px;
        background: #232329;
        border-left: 1px solid #3a3a42;
        border-right: 1px solid #0e0e12;
        border-bottom: 1px solid #0e0e12;
        overflow: hidden;
      }

      .eq-title {
        background: linear-gradient(180deg, #384868 0%, #2a3a55 30%, #1e2e48 60%, #162440 100%);
        height: 14px;
        display: flex;
        align-items: center;
        padding: 0 4px;
        border-bottom: 1px solid #0a0a10;
        gap: 3px;
      }

      .eq-title span {
        font-size: 7px;
        color: #d8dce8;
        font-weight: bold;
        letter-spacing: 1.5px;
        text-shadow: 1px 1px 0 #000;
        padding: 0 5px;
        line-height: 10px;
      }

      .eq-header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 4px 8px 2px;
      }

      #eq-graph {
        background: #000;
        border: 1px solid;
        border-color: #0a0a10 #2a2a32 #2a2a32 #0a0a10;
        image-rendering: pixelated;
      }

      .eq-header-left {
        display: flex;
        gap: 3px;
      }

      .eq-presets-btn {
        font-size: 7px;
        color: #8a8a94;
        background: linear-gradient(180deg, #42424a, #2a2a32);
        border-top: 1px solid #5a5a62;
        border-left: 1px solid #5a5a62;
        border-right: 1px solid #0e0e12;
        border-bottom: 1px solid #0e0e12;
        padding: 1px 6px;
        cursor: pointer;
        font-weight: bold;
      }

      .eq-presets-btn:hover {
        color: #c0c8d8;
      }

      .eq-body {
        display: flex;
        padding: 2px 8px 4px;
        gap: 2px;
        position: relative;
      }

      .eq-preamp-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        padding-right: 6px;
        border-right: 1px solid #1a1a22;
        margin-right: 2px;
        min-width: 28px;
      }

      .eq-preamp-section label {
        font-size: 5px;
        color: #6a6a72;
        letter-spacing: 0.5px;
      }

      .eq-sliders-section {
        display: flex;
        flex: 1;
        justify-content: space-between;
        position: relative;
        padding: 0 2px;
      }

      /* Each band gets its own classic red-to-green gradient track line */

      .eq-db-labels {
        height: 90px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        pointer-events: none;
        z-index: 2;
        padding: 0 2px;
      }

      .eq-db-labels span {
        font-size: 5px;
        color: #5a5a62;
        font-family: 'Courier New', monospace;
        white-space: nowrap;
      }

      .eq-band {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        z-index: 1;
      }

      .eq-band label {
        font-size: 5px;
        color: #6a6a72;
        font-family: 'Arial', sans-serif;
      }

      input[type='range'].eq-slider {
        writing-mode: vertical-lr;
        direction: rtl;
        height: 90px;
        width: 14px;
        -webkit-appearance: none;
        appearance: none;
        background: transparent;
      }

      input[type='range'].eq-slider::-webkit-slider-runnable-track {
        width: 3px;
        background: linear-gradient(
          180deg,
          #cc2200 0%,
          #cc8800 25%,
          #cccc00 45%,
          #66cc00 60%,
          #22aa00 75%,
          #0a6600 100%
        );
        border-left: 1px solid #0a0a0e;
        border-right: 1px solid #0a0a0e;
      }

      input[type='range'].eq-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 16px !important;
        height: 6px !important;
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0) 0 2px, #3a2e10 2px 4px, rgba(0, 0, 0, 0) 4px),
          linear-gradient(180deg, #d0b060 0%, #a08038 50%, #705a20 100%);
        border-top: 1px solid #e8d080;
        border-left: 1px solid #e8d080;
        border-bottom: 1px solid #3a2e10;
        border-right: 1px solid #3a2e10;
        margin-left: -7px;
        cursor: pointer;
      }

      input[type='range'].eq-slider::-moz-range-track {
        width: 3px;
        background: linear-gradient(
          180deg,
          #cc2200 0%,
          #cc8800 25%,
          #cccc00 45%,
          #66cc00 60%,
          #22aa00 75%,
          #0a6600 100%
        );
        border-left: 1px solid #0a0a0e;
        border-right: 1px solid #0a0a0e;
      }

      input[type='range'].eq-slider::-moz-range-thumb {
        width: 16px !important;
        height: 6px !important;
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0) 0 2px, #3a2e10 2px 4px, rgba(0, 0, 0, 0) 4px),
          linear-gradient(180deg, #d0b060 0%, #a08038 50%, #705a20 100%);
        border-top: 1px solid #e8d080;
        border-left: 1px solid #e8d080;
        border-bottom: 1px solid #3a2e10;
        border-right: 1px solid #3a2e10;
        cursor: pointer;
      }

      input#eq-preamp-slider {
        writing-mode: vertical-lr;
        direction: rtl;
        height: 90px;
        width: 14px;
        -webkit-appearance: none;
        appearance: none;
        background: transparent;
      }

      input#eq-preamp-slider::-webkit-slider-runnable-track {
        width: 3px;
        background: linear-gradient(
          180deg,
          #cc2200 0%,
          #cc8800 25%,
          #cccc00 45%,
          #66cc00 60%,
          #22aa00 75%,
          #0a6600 100%
        );
        border-left: 1px solid #0a0a0e;
        border-right: 1px solid #0a0a0e;
      }

      input#eq-preamp-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 16px;
        height: 6px;
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0) 0 2px, #3a2e10 2px 4px, rgba(0, 0, 0, 0) 4px),
          linear-gradient(180deg, #d0b060 0%, #a08038 50%, #705a20 100%);
        border-top: 1px solid #e8d080;
        border-left: 1px solid #e8d080;
        border-bottom: 1px solid #3a2e10;
        border-right: 1px solid #3a2e10;
        margin-left: -7px;
        cursor: pointer;
      }

      input#eq-preamp-slider::-moz-range-track {
        width: 3px;
        background: linear-gradient(
          180deg,
          #cc2200 0%,
          #cc8800 25%,
          #cccc00 45%,
          #66cc00 60%,
          #22aa00 75%,
          #0a6600 100%
        );
        border-left: 1px solid #0a0a0e;
        border-right: 1px solid #0a0a0e;
      }

      input#eq-preamp-slider::-moz-range-thumb {
        width: 16px;
        height: 6px;
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0) 0 2px, #3a2e10 2px 4px, rgba(0, 0, 0, 0) 4px),
          linear-gradient(180deg, #d0b060 0%, #a08038 50%, #705a20 100%);
        border-top: 1px solid #e8d080;
        border-left: 1px solid #e8d080;
        border-bottom: 1px solid #3a2e10;
        border-right: 1px solid #3a2e10;
        cursor: pointer;
      }

      .eq-freq-labels {
        display: flex;
        justify-content: space-between;
        padding: 0 10px 4px 36px;
      }

      .eq-freq-labels span {
        font-size: 5px;
        color: #6a6a72;
        font-family: 'Arial', sans-serif;
        width: 18px;
        text-align: center;
      }

      /* ===== PLAYLIST WINDOW ===== */
      .winamp-playlist {
        width: 275px;
        background: #232329;
        border-left: 1px solid #3a3a42;
        border-right: 1px solid #0e0e12;
        border-bottom: 1px solid #0e0e12;
        overflow: hidden;
      }

      .playlist-title {
        background: linear-gradient(180deg, #384868 0%, #2a3a55 30%, #1e2e48 60%, #162440 100%);
        height: 14px;
        display: flex;
        align-items: center;
        padding: 0 4px;
        border-bottom: 1px solid #0a0a10;
        gap: 3px;
      }

      .playlist-title span {
        font-size: 7px;
        color: #d8dce8;
        font-weight: bold;
        letter-spacing: 1.5px;
        text-shadow: 1px 1px 0 #000;
        padding: 0 5px;
        line-height: 10px;
      }

      .playlist-tracks {
        background: #000;
        margin: 3px 3px;
        border: 1px solid;
        border-color: #0a0a0e #1e1e24 #1e1e24 #0a0a0e;
        max-height: 130px;
        overflow-y: auto;
        padding: 1px 0;
      }

      .playlist-tracks::-webkit-scrollbar {
        width: 8px;
      }

      .playlist-tracks::-webkit-scrollbar-track {
        background: #0e0e12;
        border-left: 1px solid #1e1e24;
      }

      .playlist-tracks::-webkit-scrollbar-thumb {
        background: linear-gradient(90deg, #b89850, #8a7040);
        border: 1px solid;
        border-color: #d8b870 #4a3a18 #4a3a18 #d8b870;
      }

      .track-item {
        padding: 1px 6px;
        font-size: 8px;
        font-family: 'Courier New', monospace;
        color: #00cc00;
        cursor: pointer;
        display: flex;
        gap: 4px;
        line-height: 1.5;
      }

      .track-item:hover {
        background: #0a1a0a;
      }

      .track-item.active {
        color: #ffffff;
        background: #00008b;
      }

      .track-item.active .track-num,
      .track-item.active .track-duration {
        color: #ccccff;
      }

      .track-item.playing {
        color: #ffffff;
      }

      .track-num {
        color: #00cc00;
        min-width: 16px;
        text-align: right;
      }

      .track-name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .track-duration {
        color: #00cc00;
        min-width: 32px;
        text-align: right;
      }

      .playlist-bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 3px 4px 4px;
      }

      .playlist-buttons {
        display: flex;
        gap: 2px;
      }

      .pl-btn {
        font-size: 7px;
        color: #8a8a94;
        background: linear-gradient(180deg, #42424a, #2a2a32);
        border-top: 1px solid #5a5a62;
        border-left: 1px solid #5a5a62;
        border-right: 1px solid #0e0e12;
        border-bottom: 1px solid #0e0e12;
        padding: 1px 5px;
        cursor: pointer;
        font-weight: bold;
      }

      .pl-btn:hover {
        color: #c0c8d8;
      }

      .playlist-info-section {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .playlist-info {
        font-size: 7px;
        color: #00cc00;
        font-family: 'Courier New', monospace;
      }

      .playlist-info-led {
        font-size: 9px;
        font-weight: bold;
        text-shadow: 0 0 4px rgba(0, 200, 0, 0.35);
      }

      .playlist-mini-transport {
        display: flex;
        gap: 3px;
        align-items: center;
      }

      .pl-mini {
        font-size: 6px;
        color: #9a9aa4;
        cursor: pointer;
        line-height: 1;
        font-family: 'Arial', sans-serif;
      }

      .pl-mini:hover {
        color: #ffffff;
      }

      .pl-listopts {
        font-size: 5px;
        line-height: 1.2;
        padding: 1px 3px;
        text-align: center;
      }

      /* Playlist resize grip */
      .playlist-resize-grip {
        position: relative;
        height: 3px;
        cursor: s-resize;
      }

      .playlist-resize-grip::after {
        content: '';
        position: absolute;
        bottom: 0;
        right: 2px;
        width: 8px;
        height: 3px;
        background: repeating-linear-gradient(
          45deg,
          transparent,
          transparent 1px,
          #3a3a42 1px,
          #3a3a42 2px
        );
      }

      /* File input hidden */
      #file-input {
        display: none;
      }

      /* ===== ABOUT OVERLAY ===== */
      .about-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        z-index: 100;
        justify-content: center;
        align-items: center;
      }

      .about-overlay.visible {
        display: flex;
      }

      .about-window {
        background: #c0c0c0;
        border: 2px outset #dfdfdf;
        width: 300px;
        box-shadow: 3px 3px 0 #000;
      }

      .about-titlebar {
        background: linear-gradient(90deg, #000080, #1084d0);
        padding: 2px 4px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .about-titlebar span {
        color: #fff;
        font-size: 11px;
        font-weight: bold;
        font-family: 'Tahoma', sans-serif;
      }

      .about-close {
        width: 16px;
        height: 14px;
        background: #c0c0c0;
        border: 2px outset #dfdfdf;
        font-size: 10px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-family: 'Tahoma', sans-serif;
      }

      .about-close:active {
        border-style: inset;
      }

      .about-body {
        padding: 16px;
        text-align: center;
        font-family: 'Tahoma', 'MS Sans Serif', sans-serif;
        font-size: 11px;
      }

      .about-body h3 {
        font-size: 14px;
        margin-bottom: 8px;
        color: #000;
      }

      .about-body p {
        color: #333;
        margin: 4px 0;
      }

      .about-ok {
        margin-top: 12px;
        padding: 2px 20px;
        font-size: 11px;
        font-family: 'Tahoma', sans-serif;
        background: #c0c0c0;
        border: 2px outset #dfdfdf;
        cursor: pointer;
      }

      .about-ok:active {
        border-style: inset;
      }
    </style>
  </head>
  <body>
    <!-- About dialog -->
    <div class="about-overlay" id="about-overlay">
      <div class="about-window">
        <div class="about-titlebar">
          <span>About Winamp</span>
          <div class="about-close" onclick="closeAbout()">×</div>
        </div>
        <div class="about-body">
          <h3>Winamp Clone v1.0</h3>
          <p>A nostalgic recreation of the classic</p>
          <p>Winamp media player.</p>
          <p style="margin-top: 8px; color: #888; font-size: 9px">
            Built with HTML, CSS & JavaScript
          </p>
          <p style="color: #888; font-size: 9px">Audio API: Web Audio + HTML5 Audio</p>
          <button class="about-ok" onclick="closeAbout()">OK</button>
        </div>
      </div>
    </div>

    <div id="winamp">
      <!-- Main Player Window: sprites from skin/skin.css, placed at the reference layout. -->
      <div class="wa-main-background" id="main-window">
        <div class="wa-titlebar-active" id="title-bar">
          <button
            type="button"
            class="wa-titlebar-options"
            id="btn-options"
            data-sprite="titlebar-options"
            title="Options"
          ></button>
          <button
            type="button"
            class="wa-titlebar-minimize"
            id="btn-minimize"
            data-sprite="titlebar-minimize"
            title="Minimize"
          ></button>
          <button
            type="button"
            class="wa-titlebar-shade"
            id="btn-shade"
            data-sprite="titlebar-shade"
            title="Window shade"
          ></button>
          <button
            type="button"
            class="wa-titlebar-close"
            id="btn-close"
            data-sprite="titlebar-close"
            title="Close"
          ></button>
        </div>

        <div class="wa-titlebar-clutter" id="clutter-bar"></div>
        <div class="wa-playpaus-stop" id="play-indicator"></div>
        <div class="wa-playpaus-work-off" id="work-indicator"></div>
        <div id="time-display" role="timer" title="Elapsed / remaining time">
          <span class="sr-only" id="time-text">00:00</span>
          <span class="wa-main-time-minus" id="time-minus" hidden></span>
          <span class="wa-font-digits-48" id="time-digit-1"></span>
          <span class="wa-font-digits-48" id="time-digit-2"></span>
          <span class="wa-font-digits-48" id="time-digit-3"></span>
          <span class="wa-font-digits-48" id="time-digit-4"></span>
        </div>
        <canvas id="visualizer" width="76" height="16" title="Visualizer"></canvas>
        <div id="scrolling-title"></div>
        <div id="bitrate-val" title="kbps"></div>
        <div id="freq-val" title="kHz"></div>
        <div class="wa-monoster-mono-off" id="mono-indicator"></div>
        <div class="wa-monoster-stereo-off" id="stereo-indicator"></div>

        <input
          type="range"
          class="wa-posbar-background"
          id="seek-bar"
          min="0"
          max="100"
          value="0"
          title="Seek"
        />
        <div class="thumb wa-posbar-thumb" id="seek-thumb" data-sprite="posbar-thumb"></div>
        <input
          type="range"
          class="wa-volume-level-20"
          id="volume-slider"
          min="0"
          max="100"
          value="75"
          title="Volume"
        />
        <div class="thumb wa-volume-thumb" id="volume-thumb" data-sprite="volume-thumb"></div>
        <input
          type="range"
          class="wa-balance-level-0"
          id="balance-slider"
          min="-100"
          max="100"
          value="0"
          title="Balance"
        />
        <div class="thumb wa-balance-thumb" id="balance-thumb" data-sprite="balance-thumb"></div>

        <button
          type="button"
          class="active wa-shufrep-eq-on"
          id="btn-eq"
          data-toggle="shufrep-eq"
          title="Equalizer"
        ></button>
        <button
          type="button"
          class="active wa-shufrep-pl-on"
          id="btn-pl"
          data-toggle="shufrep-pl"
          title="Playlist"
        ></button>

        <button
          type="button"
          class="wa-cbuttons-previous"
          id="btn-prev"
          data-sprite="cbuttons-previous"
          title="Previous"
        ></button>
        <button
          type="button"
          class="wa-cbuttons-play"
          id="btn-play"
          data-sprite="cbuttons-play"
          title="Play"
        ></button>
        <button
          type="button"
          class="wa-cbuttons-pause"
          id="btn-pause"
          data-sprite="cbuttons-pause"
          title="Pause"
        ></button>
        <button
          type="button"
          class="wa-cbuttons-stop"
          id="btn-stop"
          data-sprite="cbuttons-stop"
          title="Stop"
        ></button>
        <button
          type="button"
          class="wa-cbuttons-next"
          id="btn-next"
          data-sprite="cbuttons-next"
          title="Next"
        ></button>
        <button
          type="button"
          class="wa-cbuttons-eject"
          id="btn-open"
          data-sprite="cbuttons-eject"
          title="Open file"
        ></button>
        <button
          type="button"
          class="wa-shufrep-shuffle-off"
          id="btn-shuffle"
          data-toggle="shufrep-shuffle"
          title="Shuffle"
        ></button>
        <button
          type="button"
          class="wa-shufrep-repeat-off"
          id="btn-repeat"
          data-toggle="shufrep-repeat"
          title="Repeat"
        ></button>
        <button type="button" id="btn-about" title="About Winamp"></button>
      </div>

      <!-- Equalizer Window -->
      <div class="winamp-eq" id="eq-window">
        <div class="eq-title">
          <div class="title-bar-line"></div>
          <span>WINAMP EQUALIZER</span>
          <div class="title-bar-line"></div>
        </div>
        <div class="eq-header-row">
          <div class="eq-header-left">
            <button class="toggle-btn active" id="eq-on-btn">ON</button>
            <button class="toggle-btn" id="eq-auto-btn">AUTO</button>
          </div>
          <canvas id="eq-graph" width="113" height="19"></canvas>
          <button class="eq-presets-btn" id="eq-presets-btn">PRESETS</button>
        </div>
        <div class="eq-body">
          <div class="eq-preamp-section">
            <label>PREAMP</label>
            <input
              type="range"
              id="eq-preamp-slider"
              class="eq-slider"
              min="-12"
              max="12"
              value="0"
            />
          </div>
          <div class="eq-sliders-section" id="eq-bands">
            <!-- Bands generated by JS -->
          </div>
        </div>
        <div class="eq-freq-labels" id="eq-freq-labels">
          <!-- Generated by JS -->
        </div>
      </div>

      <!-- Playlist Window -->
      <div class="winamp-playlist" id="playlist-window">
        <div class="playlist-title">
          <div class="title-bar-line"></div>
          <span>WINAMP PLAYLIST</span>
          <div class="title-bar-line"></div>
        </div>
        <div class="playlist-tracks" id="playlist-tracks">
          <!-- Tracks added dynamically -->
        </div>
        <div class="playlist-bottom">
          <div class="playlist-buttons">
            <button class="pl-btn" id="pl-add-btn" title="Add files">ADD</button>
            <button class="pl-btn" id="pl-rem-btn" title="Remove selected">REM</button>
            <button class="pl-btn" id="pl-sel-btn" title="Select">SEL</button>
            <button class="pl-btn" id="pl-misc-btn" title="Misc">MISC</button>
          </div>
          <div class="playlist-info-section">
            <span class="playlist-info" id="playlist-total-length">0:00</span>
            <div class="playlist-mini-transport">
              <span class="pl-mini" id="pl-mini-prev" title="Previous">&#9198;&#xFE0E;</span>
              <span class="pl-mini" id="pl-mini-play" title="Play">&#9654;&#xFE0E;</span>
              <span class="pl-mini" id="pl-mini-pause" title="Pause">&#9646;&#9646;&#xFE0E;</span>
              <span class="pl-mini" id="pl-mini-stop" title="Stop">&#9632;&#xFE0E;</span>
              <span class="pl-mini" id="pl-mini-next" title="Next">&#9197;&#xFE0E;</span>
            </div>
            <span class="playlist-info playlist-info-led" id="playlist-total-time">0:00:00:00</span>
            <button class="pl-btn pl-listopts" id="pl-listopts-btn" title="List options">
              LIST<br />OPTS
            </button>
          </div>
        </div>
        <div class="playlist-resize-grip"></div>
      </div>
    </div>

    <input type="file" id="file-input" accept="audio/*" multiple />

    <script src="app.js"></script>
  </body>
</html>
